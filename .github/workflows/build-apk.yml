name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTiles-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ClassicTiles.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ClassicTiles.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Debug build from commit ${GITHUB_SHA::7}" \
            --prerelease
